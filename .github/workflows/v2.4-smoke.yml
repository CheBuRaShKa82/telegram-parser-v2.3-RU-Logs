name: v2.4 smoke

on:
  push:
    branches:
      - main
      - fix/v2.4-audit
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff pip-audit
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Fatal lint
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Compile Python sources
        run: python -m py_compile main.py defunc.py config_store.py config_ui.py logging_setup.py sessions.py storage.py parser.py inviter.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Storage smoke test
        run: |
          python - <<'PY'
          import os
          import tempfile
          from types import SimpleNamespace

          from storage import (
              candidate_from_raw,
              connect_db,
              exclusion_add,
              exclusion_has,
              load_user_candidates,
              upsert_user,
          )

          with tempfile.TemporaryDirectory() as tmp:
              db = os.path.join(tmp, "test.db")
              conn = connect_db(db)
              user = SimpleNamespace(
                  id=123456,
                  username="example_user",
                  first_name="Test",
                  last_name="User",
              )
              upsert_user(
                  conn,
                  user,
                  source_id="-1001",
                  source_title="Test source",
                  source_type="participants",
              )
              conn.commit()
              users = load_user_candidates(conn)
              assert len(users) == 1
              assert users[0].user_id == 123456
              assert candidate_from_raw("123456:999999").user_id == 123456

              exclusion_add(
                  conn,
                  "id:123456",
                  user_id=123456,
                  username="example_user",
                  reason="target_only",
                  target_key="@target-a",
              )
              assert exclusion_has(conn, "id:123456", target_key="@target-a")
              assert not exclusion_has(conn, "id:123456", target_key="@target-b")
              conn.close()
          PY
